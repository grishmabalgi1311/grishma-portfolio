name: Validate portfolio
on: [push, pull_request]
permissions:
  contents: read
jobs:
  static-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app.js && node --check cv-projects.js && node --check project-data.js && node --check workbench.js
      - run: python tools/validate_site.py
